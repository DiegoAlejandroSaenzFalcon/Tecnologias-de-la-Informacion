site_name: Soporte TI — Guía Completa de Aprendizaje
site_url: https://diegoalejandrosaenzfalcon.github.io/Tecnologias-de-la-Informacion/
site_description: Guía de estudio completa y gratuita basada en Google IT Support Professional Certificate
site_author: Diego Alejandro Saenz Falcon
copyright: Copyright &copy; 2024 Diego Alejandro Saenz Falcon

repo_url: https://github.com/DiegoAlejandroSaenzFalcon/Tecnologias-de-la-Informacion
repo_name: DiegoAlejandroSaenzFalcon/Tecnologias-de-la-Informacion

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
    - scheme: slate
      primary: indigo
      accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Inicio: index.md
  - Guía Google IT Support:
    - Visión General: guia-google-it-support/README.md
    - Curso 1 - Fundamentos: guia-google-it-support/curso-01-fundamentos-de-soporte-tecnico/README.md
    - Curso 2 - Redes: guia-google-it-support/curso-02-redes-de-computadoras/README.md
    - Curso 3 - Sistemas Operativos: guia-google-it-support/curso-03-sistemas-operativos/README.md
    - Curso 4 - Administración: guia-google-it-support/curso-04-administracion-de-sistemas/README.md
    - Curso 5 - Seguridad: guia-google-it-support/curso-05-seguridad-informatica/README.md
    - Curso 6 - IA y Empleo: guia-google-it-support/curso-06-acelera-tu-busqueda-de-empleo-con-ia/README.md
  - Guías Complementarias:
    - Introducción Informática (Microsoft): guia-microsoft-introduccion-a-la-informatica/README.md
    - GitHub para Principiantes: guia-github-basico/README.md
    - Conectar el Google TV a internet: guia-conectar-google-tv/README.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiegoAlejandroSaenzFalcon

plugins:
  - search
